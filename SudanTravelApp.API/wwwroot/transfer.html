<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نقل بيانات ودنوح AAMN</title>
  <style>
    body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;min-height:100vh;display:grid;place-items:center;margin:0;padding:18px}
    main{width:min(560px,100%);background:#fff;border:1px solid #e3e7ee;border-radius:8px;padding:24px;box-shadow:0 14px 40px rgba(16,26,44,.08)}
    h1{font-size:1.5rem;margin:0 0 10px}p{line-height:1.8;color:#667085}.btn{display:inline-flex;margin-top:14px;border:0;border-radius:8px;background:#d4881b;color:#111827;font-weight:800;padding:11px 16px;text-decoration:none;cursor:pointer}
    .ok{color:#13875a;font-weight:800}.err{color:#c13b31;font-weight:800}
  </style>
</head>
<body>
  <main>
    <h1>نقل بيانات لوحة التحكم</h1>
    <p id="status">يتم فحص بيانات الموقع...</p>
    <button class="btn" id="transferBtn" type="button">نقل البيانات إلى 2-aa.com</button>
    <a class="btn" id="adminLink" href="/admin.html" style="display:none">فتح لوحة التحكم</a>
  </main>
  <script>
    const keys = ['aamn_site_settings','aamn_admin_login','aamn_operations','aamn_lab_sales','aamn_departments','aamn_department_items'];
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('transferBtn');
    const adminLink = document.getElementById('adminLink');
    function encodeData() {
      const data = {};
      keys.forEach((key) => {
        const value = localStorage.getItem(key);
        if (value) data[key] = value;
      });
      return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    }
    function importData() {
      const hash = new URLSearchParams(location.hash.slice(1));
      const payload = hash.get('import');
      if (!payload) return false;
      const data = JSON.parse(decodeURIComponent(escape(atob(payload))));
      Object.entries(data).forEach(([key, value]) => localStorage.setItem(key, value));
      statusEl.innerHTML = '<span class="ok">تم نقل بيانات لوحة التحكم إلى هذا الدومين.</span>';
      btn.style.display = 'none';
      adminLink.style.display = 'inline-flex';
      return true;
    }
    function exportData() {
      const payload = encodeData();
      if (!payload || payload === 'e30=') {
        statusEl.innerHTML = '<span class="err">لا توجد بيانات محفوظة في هذا الدومين.</span>';
        return;
      }
      location.href = `https://2-aa.com/transfer.html#import=${payload}`;
    }
    if (!importData()) {
      statusEl.textContent = location.hostname.includes('wadnooh.com')
        ? 'اضغط الزر لنقل بيانات لوحة التحكم من wadnooh.com إلى 2-aa.com.'
        : 'لا توجد بيانات مستوردة بعد. افتح هذه الصفحة من wadnooh.com/transfer.html لنقل البيانات.';
      btn.onclick = exportData;
    }
  </script>
</body>
</html>
