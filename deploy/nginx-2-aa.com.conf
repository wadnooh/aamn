# Nginx reverse proxy for 2-aa.com
# Place at: /etc/nginx/sites-available/2-aa.com

# 1. HTTP to HTTPS redirect for 2-aa.com and old domain wadnooh.com
server {
    listen 80;
    listen [::]:80;
    server_name 2-aa.com www.2-aa.com wadnooh.com www.wadnooh.com;
    return 301 https://2-aa.com$request_uri;
}

# 2. HTTPS www to apex redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.2-aa.com;
    ssl_certificate     /etc/letsencrypt/live/2-aa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2-aa.com/privkey.pem;
    return 301 https://2-aa.com$request_uri;
}

# 3. Main server block for 2-aa.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 2-aa.com;

    ssl_certificate     /etc/letsencrypt/live/2-aa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2-aa.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location / {
        proxy_pass         http://127.0.0.1:5162;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
