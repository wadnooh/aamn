# Nginx redirection from legacy domain wadnooh.com to 2-aa.com
# Place at: /etc/nginx/sites-available/wadnooh.com

server {
    listen 80;
    listen [::]:80;
    server_name wadnooh.com www.wadnooh.com;
    return 301 https://2-aa.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wadnooh.com www.wadnooh.com;

    ssl_certificate     /etc/letsencrypt/live/wadnooh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wadnooh.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://2-aa.com$request_uri;
}
